name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby for xcpretty
        uses: ruby/setup-ruby@v1

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test -project AntigravityCloudKit.xcodeproj -scheme AntigravityCloudKit -destination 'platform=iOS Simulator,name=iPhone 14,OS=17.0' -enableCodeCoverage YES | xcpretty
