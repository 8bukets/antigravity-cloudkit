name: CI
on:
  push:
    branches: [ main, feature/icloud-setup ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby for xcpretty
        uses: ruby/setup-ruby@v1

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test -project AntigravityCloudKit.xcodeproj -scheme AntigravityCloudKit -destination 'platform=iOS Simulator,name=iPhone 14,OS=17.0' -only-testing:AntigravityCloudKitTests | xcpretty

  integration-tests:
    name: Run integration tests on simulator
    runs-on: macos-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew tap homebrew/cask
          brew install --cask "libimobiledevice" || true

      - name: Boot simulator
        run: |
          xcrun simctl bootstatus "iPhone 14" -b || true

      - name: Run integration tests (simulator)
        run: |
          set -o pipefail
          xcodebuild test -project AntigravityCloudKit.xcodeproj -scheme AntigravityCloudKit -destination 'platform=iOS Simulator,name=iPhone 14,OS=17.0' -only-testing:AntigravityCloudKitTests/IntegrationTests | xcpretty
